    type: int
    restore_value: no
    initial_value: '50'
  - id: last_enc_val
    type: int
    restore_value: no
    initial_value: '0'
  - id: edit_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: current_page_idx
    type: int
    restore_value: no
    initial_value: '0'   # 0=spinner, 1=arc, 2=text
    
spi:
