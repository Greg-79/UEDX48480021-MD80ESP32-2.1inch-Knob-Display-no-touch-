lvgl:
  displays:
    - my_display
  buffer_size: 20%
  bg_color: 0x000000
  scrollable: false
  page_wrap: true
  pages:

    # ---------------- Страница 1: Spinners ----------------
    - id: page_spinners
      widgets:
        - obj:
            id: boot_screen
            x: 0
            y: 0
            width: 480
            height: 480
            radius: 0
            pad_all: 0
            border_width: 0
            widgets:
              - spinner:
                  align: center
                  width: 150
                  height: 150
                  arc_width: 20
                  bg_color: 0x000000
                  arc_opa: TRANSP
                  spin_time: 4s
                  arc_length: 110deg
                  id: spinner_id
                  indicator:
                    arc_color: 0xaaaaff
                    arc_rounded: false
              - spinner:
                  align: center
                  width: 100
                  height: 100
                  arc_width: 20
                  bg_color: 0x000000
                  arc_opa: TRANSP
                  spin_time: 3s
                  arc_length: 90deg
                  id: spinner_id2
                  indicator:
                    arc_color: 0xaaff00
                    arc_rounded: false
                  on_press:
                    - lvgl.page.next:
    - id: page_arc
      widgets:
        - arc:
            id: page2_arc
            align: center
            width: 400
            height: 400
            min_value: 0
            max_value: 100
            value: 50
            bg_opa: 0%
            arc_width: 20
            arc_color: 0xFF2222
            indicator:
              arc_color: 0xFF0000
              arc_width: 20
            knob:
              bg_color: 0xFFFFFF
              pad_all: 8
        - label:
            id: page2_value
            align: center
            text: "50"
            text_color: 0xFFFFFF
            text_font: font_48

    # ---------------- Страница 3: Text ----------------
    - id: page_text
      widgets:
        - label:
            align: center
            text: "ПРИВЕТ!!!"
            text_color: 0x00FF00
            text_font: font_52

# --- Кнопка ---
binary_sensor:
  - platform: gpio
    name: "SW_KEY"
    pin:
      number: GPIO0
      inverted: false
      mode:
        input: true
        pullup: true
    id: button_1
    device_class: power
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      then:
        - lambda: |-
            if (id(current_page_idx) == 1) {
              id(edit_mode) = !id(edit_mode);
              ESP_LOGI("main", "Edit mode: %s", id(edit_mode) ? "ON" : "OFF");
            }

# --- Энкодер ---
sensor:
  - platform: rotary_encoder
    name: "Rotary Encoder"
    id: rotary
    pin_a:
      number: GPIO6
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO5
      mode:
        input: true
        pullup: true
    min_value: -10000
    max_value: 10000
    resolution: 1
    filters:
      - debounce: 0.15s
    on_value:
      then:
        # 1. Обновляем переменные состояния
        - lambda: |-
            static uint32_t last_change = 0;
            uint32_t now = millis();
            int cur = id(rotary).state;
            int delta = cur - id(last_enc_val);
            id(last_enc_val) = cur;

            // Антидребезг по времени
            if (delta == 0) return;
            if (now - last_change < 120) return;
            last_change = now;

            if (id(edit_mode)) {
              // Режим редактирования: меняем arc_value шагами по 2
              int v = id(arc_value) + (delta > 0 ? 2 : -2);
              if (v < 0) v = 0;
              if (v > 100) v = 100;
              id(arc_value) = v;
            } else {
              // Режим навигации: переключаем страницы
              if (delta > 0) {
                id(current_page_idx) = (id(current_page_idx) + 1) % 3;
              } else {
                id(current_page_idx) = (id(current_page_idx) + 2) % 3;
              }
            }

        # 2. Если в режиме редактирования — обновляем arc и label
        - if:
            condition:
              lambda: 'return id(edit_mode);'
            then:
              - lvgl.arc.update:
                  id: page2_arc
                  value: !lambda 'return id(arc_value);'
              - lvgl.label.update:
                  id: page2_value
                  text: !lambda 'return std::to_string(id(arc_value)).c_str();'

        # 3. Переключение страниц (только если не в режиме редактирования)
        - if:
            condition:
              lambda: 'return !id(edit_mode) && id(current_page_idx) == 0;'
            then:
              - lvgl.page.show: page_spinners
        - if:
            condition:
              lambda: 'return !id(edit_mode) && id(current_page_idx) == 1;'
            then:
              - lvgl.page.show: page_arc
        - if:
            condition:
              lambda: 'return !id(edit_mode) && id(current_page_idx) == 2;'
            then:
              - lvgl.page.show: page_text
