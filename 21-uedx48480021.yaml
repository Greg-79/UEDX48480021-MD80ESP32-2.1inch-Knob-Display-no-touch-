# Board: Espressif ESP32-S3-DevKitC-1-N16R8V (16 MB Flash Quad, 8 MB PSRAM Octal)

esphome:
  name: 21-uedx48480021
  friendly_name: 21_UEDX48480021

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
#  level: VERBOSE # для тестирования

api:
  encryption:
    key: "........."

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: 21_UEDX48480021 Fallback Hotspot
    password: "......"

captive_portal:

psram:
  mode: octal
  speed: 80MHz

web_server:
  version: 3

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO7
    inverted: true
    frequency: 150Hz

light:
  - platform: monochromatic
    name: Backlight
    id: display_backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 1s
    
globals:
